<svg width="500" height="400" viewBox="0 0 500 400" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Background Elements -->
    <rect width="500" height="400" fill="#F3F4F6"/>
    
    <!-- Team Members -->
    <g transform="translate(50, 100)">
        <!-- Person 1 -->
        <circle cx="0" cy="0" r="40" fill="#2563EB" opacity="0.2"/>
        <circle cx="0" cy="0" r="30" fill="#2563EB" opacity="0.4"/>
        <circle cx="0" cy="0" r="20" fill="#2563EB" opacity="0.6"/>
        
        <!-- Person 2 -->
        <circle cx="100" cy="0" r="40" fill="#2563EB" opacity="0.2"/>
        <circle cx="100" cy="0" r="30" fill="#2563EB" opacity="0.4"/>
        <circle cx="100" cy="0" r="20" fill="#2563EB" opacity="0.6"/>
        
        <!-- Person 3 -->
        <circle cx="200" cy="0" r="40" fill="#2563EB" opacity="0.2"/>
        <circle cx="200" cy="0" r="30" fill="#2563EB" opacity="0.4"/>
        <circle cx="200" cy="0" r="20" fill="#2563EB" opacity="0.6"/>
    </g>
    
    <!-- Technology Elements -->
    <g transform="translate(300, 100)">
        <!-- AI Brain -->
        <path d="M0 0C50 0 100 50 100 100C100 150 50 200 0 200C-50 200 -100 150 -100 100C-100 50 -50 0 0 0Z" fill="#2563EB" opacity="0.1"/>
        <path d="M0 0C50 0 100 50 100 100C100 150 50 200 0 200C-50 200 -100 150 -100 100C-100 50 -50 0 0 0Z" stroke="#2563EB" stroke-width="2"/>
        
        <!-- Neural Network -->
        <circle cx="0" cy="50" r="10" fill="#2563EB"/>
        <circle cx="0" cy="100" r="10" fill="#2563EB"/>
        <circle cx="0" cy="150" r="10" fill="#2563EB"/>
        
        <circle cx="-50" cy="75" r="10" fill="#2563EB"/>
        <circle cx="-50" cy="125" r="10" fill="#2563EB"/>
        
        <circle cx="50" cy="75" r="10" fill="#2563EB"/>
        <circle cx="50" cy="125" r="10" fill="#2563EB"/>
        
        <!-- Connection Lines -->
        <path d="M0 50L-50 75" stroke="#2563EB" stroke-width="2"/>
        <path d="M0 50L50 75" stroke="#2563EB" stroke-width="2"/>
        <path d="M0 100L-50 75" stroke="#2563EB" stroke-width="2"/>
        <path d="M0 100L50 75" stroke="#2563EB" stroke-width="2"/>
        <path d="M0 100L-50 125" stroke="#2563EB" stroke-width="2"/>
        <path d="M0 100L50 125" stroke="#2563EB" stroke-width="2"/>
        <path d="M0 150L-50 125" stroke="#2563EB" stroke-width="2"/>
        <path d="M0 150L50 125" stroke="#2563EB" stroke-width="2"/>
    </g>
    
    <!-- Connection Lines -->
    <path d="M200 100L300 100" stroke="#2563EB" stroke-width="2" stroke-dasharray="5 5"/>
</svg> 