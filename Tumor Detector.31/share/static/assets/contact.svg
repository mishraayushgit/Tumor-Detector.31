<svg width="500" height="400" viewBox="0 0 500 400" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Background Elements -->
    <circle cx="250" cy="200" r="150" fill="#F3F4F6"/>
    
    <!-- Communication Icons -->
    <g transform="translate(150, 150)">
        <!-- Email Icon -->
        <rect x="0" y="0" width="40" height="30" rx="5" fill="#2563EB" opacity="0.2"/>
        <path d="M5 5L20 15L35 5" stroke="#2563EB" stroke-width="2"/>
        <line x1="5" y1="25" x2="35" y2="25" stroke="#2563EB" stroke-width="2"/>
        
        <!-- Phone Icon -->
        <path d="M60 5C65 5 70 10 70 15V25C70 30 65 35 60 35" stroke="#2563EB" stroke-width="2"/>
        <path d="M60 5C55 5 50 10 50 15V25C50 30 55 35 60 35" stroke="#2563EB" stroke-width="2"/>
        <line x1="55" y1="10" x2="65" y2="10" stroke="#2563EB" stroke-width="2"/>
        
        <!-- Message Icon -->
        <path d="M90 5H120V25L105 15L90 25V5Z" fill="#2563EB" opacity="0.2"/>
        <path d="M90 5H120V25L105 15L90 25V5Z" stroke="#2563EB" stroke-width="2"/>
    </g>
    
    <!-- Connection Lines -->
    <path d="M250 200L350 200" stroke="#2563EB" stroke-width="2" stroke-dasharray="5 5"/>
    <path d="M250 200L150 200" stroke="#2563EB" stroke-width="2" stroke-dasharray="5 5"/>
    
    <!-- Outer Circles -->
    <circle cx="250" cy="200" r="180" stroke="#2563EB" stroke-width="2" stroke-dasharray="5 5"/>
    <circle cx="250" cy="200" r="200" stroke="#2563EB" stroke-width="2" stroke-dasharray="5 5"/>
</svg> 